{% extends "austere/templates/base.html" %}

{% block head_extra %}
<script defer src="https://whatchord.fly.dev/script.js"></script>
<style>
/* Wider text column than the theme's 70ch. Set in rem, not ch: ch follows the font, so the
   column would shrink when the web font replaces the fallback. Phones are limited by the screen. */
html{max-width:48rem}
/* The theme justifies paragraphs, which leaves uneven gaps between words; keep the normal ragged right edge */
p{text-align:left}
/* Long identifiers in prose must fit narrow screens; preformatted code can still scroll */
article{overflow-wrap:anywhere}
/* No footer: the copyright line is gone, and feed readers find the feeds via the <link rel=alternate> in <head> */
footer.s,hr:has(+footer.s){display:none}
/* The theme doesn't style tables: give them the same bottom margin as paragraphs and some room between columns */
table{margin:0 0 1.5rem;border-collapse:collapse}
th,td{padding:.15rem 1.25rem .15rem 0;text-align:left}
/* SVG placement and Markdown: one column on phones, optional columns on larger screens */
.svg-block{display:grid;grid-template-columns:minmax(0,1fr);gap:1.5rem;align-items:start;margin:0 0 1.5rem}
.svg-block>svg{display:block;width:100%;max-width:100%;height:auto;min-width:0}
.svg-position-left>svg{justify-self:start}
.svg-position-right>svg{justify-self:end}
.svg-position-center>svg,.svg-layout-beside.svg-has-text>svg{justify-self:center}
.svg-text{min-width:0;text-align:left}
.svg-text p{text-align:inherit}
.svg-text-align-center>.svg-text{text-align:center}
.svg-text-align-right>.svg-text{text-align:right}
.svg-text-valign-center>.svg-text{align-self:center}
.svg-text-valign-bottom>.svg-text{align-self:end}
.svg-text>:last-child{margin-bottom:0}
@media (min-width:48rem){
  .svg-layout-beside.svg-has-text:not(.svg-position-center){grid-template-columns:280px minmax(0,1fr);grid-template-areas:"diagram text"}
  .svg-layout-beside.svg-has-text.svg-position-right{grid-template-columns:minmax(0,1fr) 280px;grid-template-areas:"text diagram"}
  .svg-layout-beside.svg-has-text:not(.svg-position-center)>svg{grid-area:diagram}
  .svg-layout-beside.svg-has-text:not(.svg-position-center)>.svg-text{grid-area:text}
}
/* Figure panel buttons: the script shows them only when a multi-panel figure is too small to read */
.svg-panels{display:flex;flex-wrap:wrap;gap:.4rem;margin-bottom:-.75rem;font-family:system-ui,sans-serif;font-size:.85rem;line-height:1.4}
.svg-panels[hidden]{display:none}
.svg-position-center>.svg-panels{justify-content:center}
.svg-panels button{font:inherit;color:inherit;background:none;border:1px solid;border-radius:999px;padding:.35rem .9rem;cursor:pointer;opacity:.7}
.svg-panels button[aria-pressed="true"]{opacity:1;color:var(--accent);font-weight:600}
.svg-panels button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* Table of contents: folded box above the post, a sticky margin column on wide screens */
.toc{border:1px solid;border-radius:.4rem;padding:.75rem 1rem;margin:0 0 1.5rem;font-size:.9rem}
html.light .toc{border-color:{{ config.extra.colours.light.border }}}
html.dark .toc{border-color:{{ config.extra.colours.dark.border }}}
.toc summary{cursor:pointer;font-weight:600}
.toc ul{list-style:none;margin:.5rem 0 0;padding:0}
.toc ul ul{margin:0;padding-left:1rem}
.toc li{margin:.2rem 0}
html .toc a{text-decoration:none;color:inherit;opacity:.75}
html .toc a:hover,html .toc a.is-active{opacity:1;color:var(--accent)}
html .toc a.is-active{font-weight:600}
@media (min-width:1360px){
  .toc{position:fixed;top:7rem;left:max(1.5rem,calc(50vw - 24rem - 18rem));width:15rem;max-height:calc(100vh - 10rem);overflow-y:auto;border:0;padding:0;margin:0}
  .toc summary{pointer-events:none;list-style:none;text-transform:uppercase;letter-spacing:.06em;font-size:.75rem;opacity:.7}
  .toc summary::-webkit-details-marker{display:none}
}
/* Side notes (the aside shortcode): a ruled block in the text, the right margin on wide screens */
.aside{display:block;margin:.75rem 0;padding:.35rem 0;border:solid;border-width:1px 0;font-size:.85rem;line-height:1.5;opacity:.8}
html.light .aside{border-color:{{ config.extra.colours.light.border }}}
html.dark .aside{border-color:{{ config.extra.colours.dark.border }}}
@media (min-width:1360px){
  .aside{float:right;clear:right;width:15rem;margin:.2rem -17rem 1rem 0;padding:0;border:0}
  /* The theme's hr clears floats, so a tall note in the margin would push a --- down and leave a gap in the text */
  article hr{clear:none}
}
</style>
{% endblock head_extra %}

{% block body_end %}
{{ super() }}
<script>
/* Side notes are written after the block they annotate, which is the reading order on narrow screens.
   In the wide layout they float into the margin, and a float lines up with what follows it,
   so move each one back in front of its block there. */
(function(){
  var wide=matchMedia('(min-width:1360px)'),notes=[];
  [].forEach.call(document.querySelectorAll('article p>.aside'),function(a){
    var p=a.parentNode;if(p.children.length!==1||p.textContent.trim()!==a.textContent.trim())return;
    var t=p.previousElementSibling;while(t&&t.querySelector(':scope>.aside:only-child'))t=t.previousElementSibling;
    if(t)notes.push({p:p,target:t,home:p.parentNode.insertBefore(document.createComment(''),p)});
  });
  function place(){notes.forEach(function(n){(wide.matches?n.target:n.home).before(n.p)})}
  place();wide.addEventListener('change',place);
})();
(function(){
  var toc=document.querySelector('.toc');if(!toc)return;
  var wide=matchMedia('(min-width:1360px)');
  function fold(){if(wide.matches)toc.open=true}
  fold();wide.addEventListener('change',fold);
  var links=[].slice.call(toc.querySelectorAll('a[href*="#"]')),byId={};
  links.forEach(function(a){byId[decodeURIComponent(a.hash.slice(1))]=a});
  var heads=[].slice.call(document.querySelectorAll('article h2[id],article h3[id]')).filter(function(h){return byId[h.id]});
  function mark(){
    var cur=null;heads.forEach(function(h){if(h.getBoundingClientRect().top<120)cur=h});
    links.forEach(function(a){a.classList.remove('is-active')});
    if(cur)byId[cur.id].classList.add('is-active');
  }
  addEventListener('scroll',mark,{passive:true});mark();
})();
/* Multi-panel figures on narrow screens. The svg shortcode's `panels` list names the panels:
   "Label" takes the SVG's next top-level <g>, and "Label @ x0-x1" takes that horizontal range
   of the viewBox. When the whole figure would draw its labels smaller than MIN_PX, buttons above
   it pick one panel: the other panels' elements are hidden and the viewBox zooms to the chosen
   one. Text that spans two ranges (a shared caption) is centred in the shown one. Without
   JavaScript, and in feed readers, the whole figure shows as before. */
(function(){
  var MIN_PX=9,PAD=8,TOL=2,
      LEAF='text,line,path,rect,circle,ellipse,polygon,polyline,use,image',
      SKIP='defs,marker,pattern,clipPath,mask,symbol,title,desc';
  [].forEach.call(document.querySelectorAll('.svg-block[data-panels]'),function(block){
    var svg=block.querySelector(':scope>svg');
    if(!svg||!svg.getAttribute('viewBox')||!window.ResizeObserver)return;
    var full=svg.getAttribute('viewBox'),fullW=svg.viewBox.baseVal.width;
    var specs=block.dataset.panels.split('|').map(function(s){
      var m=s.trim().match(/^(.*?)\s*@\s*(-?[\d.]+)\s*-\s*(-?[\d.]+)$/);
      return m?{label:m[1],x0:+m[2],x1:+m[3]}:{label:s.trim()};
    });
    var ranged=specs.filter(function(p){return 'x0' in p}).length;
    var groups=[].filter.call(svg.children,function(c){return c.tagName==='g'});
    if(ranged?ranged!==specs.length:groups.length!==specs.length)return;
    if(!ranged)specs.forEach(function(p,i){p.g=groups[i]});
    var leaves=[].filter.call(svg.querySelectorAll(LEAF),function(el){return !el.closest(SKIP)});
    var sizes=leaves.filter(function(el){return el.tagName==='text'})
      .map(function(t){return parseFloat(getComputedStyle(t).fontSize)}).sort(function(a,b){return a-b});
    var base=sizes.length?sizes[sizes.length>>1]:12;

    /* Bounding box of an element in the viewBox's coordinates, whatever transforms sit above it */
    function boxOf(el){
      var b=el.getBBox(),m=svg.getScreenCTM().inverse().multiply(el.getScreenCTM()),xs=[],ys=[];
      [[b.x,b.y],[b.x+b.width,b.y],[b.x,b.y+b.height],[b.x+b.width,b.y+b.height]].forEach(function(p){
        var q=new DOMPoint(p[0],p[1]).matrixTransform(m);xs.push(q.x);ys.push(q.y);
      });
      return {x0:Math.min.apply(0,xs),x1:Math.max.apply(0,xs),y0:Math.min.apply(0,ys),y1:Math.max.apply(0,ys),a:m.a||1};
    }

    /* For every panel: which elements show, how far shared text moves, and where the panel sits.
       Every panel gets the same viewBox size, so switching doesn't move the text below. */
    function makePlan(){
      var boxes=leaves.map(boxOf),top=Infinity,bottom=-Infinity,width=0;
      boxes.forEach(function(b){top=Math.min(top,b.y0);bottom=Math.max(bottom,b.y1)});
      var owner=leaves.map(function(el){
        for(var i=0;i<specs.length;i++)if(specs[i].g&&specs[i].g.contains(el))return i;
        return -1;
      });
      var panels=specs.map(function(p,pi){
        var x0=p.x0,x1=p.x1;
        if(p.g){
          x0=Infinity;x1=-Infinity;
          boxes.forEach(function(b,i){if(owner[i]===pi){x0=Math.min(x0,b.x0);x1=Math.max(x1,b.x1)}});
        }
        var mid=(x0+x1)/2,lo=Infinity,hi=-Infinity;
        var state=leaves.map(function(el,i){
          var b=boxes[i],dx=0,vis;
          if(owner[i]>=0)vis=owner[i]===pi;
          else if(b.x0>=x0-TOL&&b.x1<=x1+TOL)vis=true;
          else if(b.x1<=x0+TOL||b.x0>=x1-TOL)vis=false;
          else if(el.tagName==='text'&&!el.hasAttribute('transform')&&
                  getComputedStyle(el).textAnchor==='middle'&&b.x1-b.x0<=x1-x0){vis=true;dx=mid-(b.x0+b.x1)/2}
          else vis=false;
          if(vis){lo=Math.min(lo,b.x0+dx);hi=Math.max(hi,b.x1+dx)}
          return {vis:vis,dx:dx/b.a};
        });
        width=Math.max(width,hi-lo);
        return {state:state,mid:(lo+hi)/2};
      });
      return {panels:panels,w:width+2*PAD,y:top-PAD,h:bottom-top+2*PAD};
    }

    var plan=null,cur=0,narrow=null;
    function apply(i){
      var p=plan.panels[i];
      leaves.forEach(function(el,k){
        var s=p.state[k];
        el.style.visibility=s.vis?'':'hidden';
        if(s.dx||el.dataset.panelX!=null){
          if(el.dataset.panelX==null)el.dataset.panelX=el.getAttribute('x')||'0';
          el.setAttribute('x',+el.dataset.panelX+s.dx);
        }
      });
      svg.setAttribute('viewBox',[p.mid-plan.w/2,plan.y,plan.w,plan.h].join(' '));
      svg.style.aspectRatio=plan.w+' / '+plan.h;
    }
    function reset(){
      leaves.forEach(function(el){
        el.style.visibility='';
        if(el.dataset.panelX!=null){el.setAttribute('x',el.dataset.panelX);delete el.dataset.panelX}
      });
      svg.setAttribute('viewBox',full);
      svg.style.aspectRatio='';
    }

    var bar=document.createElement('div');
    bar.className='svg-panels';bar.hidden=true;
    bar.setAttribute('role','group');bar.setAttribute('aria-label','Figure panels');
    var buttons=specs.map(function(p,i){
      var b=document.createElement('button');
      b.type='button';b.textContent=p.label;
      b.addEventListener('click',function(){cur=i;apply(i);mark()});
      bar.appendChild(b);return b;
    });
    function mark(){buttons.forEach(function(b,i){b.setAttribute('aria-pressed',String(i===cur))})}
    block.insertBefore(bar,svg);

    function update(){
      var w=svg.getBoundingClientRect().width;if(!w)return;
      var n=base*w/fullW<MIN_PX;
      if(n===narrow)return;
      narrow=n;bar.hidden=!n;
      if(n){plan=plan||makePlan();apply(cur);mark()}else reset();
    }
    new ResizeObserver(update).observe(block);
    update();
  });
})();
</script>
{% endblock body_end %}
