<svg id="fig-frames" viewBox="0 0 1000 465" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="ff-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker>
<pattern id="ff-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-opacity="0.11" stroke-width="3"/></pattern>
</defs>

<!-- ============ 1: FP at the top, fixed frame ============ -->
<g>
<g text-anchor="middle" fill="currentColor">
<text x="225" y="30" font-size="15" font-weight="600">FP at the top</text>
<text x="225" y="48" font-size="12" fill-opacity="0.65">x86, RISC-V, AArch64</text>
</g>
<rect x="140" y="70" width="170" height="40" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="4 3"/>
<g fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6">
<rect x="140" y="110" width="170" height="60"/>
<rect x="140" y="194" width="170" height="166"/>
<rect x="140" y="360" width="170" height="50"/>
</g>
<rect x="140" y="170" width="170" height="24" fill="#2a9d7f" fill-opacity="0.25" stroke="#2a9d7f" stroke-width="1.5"/>
<rect x="144" y="335" width="162" height="21" fill="none" stroke="#2a9d7f" stroke-width="1.2" stroke-dasharray="4 3"/>
<g text-anchor="middle" fill="currentColor" font-size="12.5">
<text x="225" y="94" fill-opacity="0.65">incoming stack arguments</text>
<text x="225" y="136">return address,</text>
<text x="225" y="152">callee-saved registers</text>
<text x="225" y="186" font-weight="600">emergency slot</text>
<text x="225" y="262">local variables,</text>
<text x="225" y="278">spill slots</text>
<text x="225" y="350" font-size="11.5" fill-opacity="0.75">slot here if there is no FP</text>
<text x="225" y="382">outgoing arguments</text>
<text x="225" y="399" font-size="11.5" fill-opacity="0.65">reserved call frame</text>
</g>
<g stroke="currentColor" stroke-width="1.3" marker-end="url(#ff-arrow)">
<line x1="86" y1="110" x2="136" y2="110"/>
<line x1="86" y1="170" x2="136" y2="170"/>
<line x1="86" y1="410" x2="136" y2="410"/>
</g>
<g text-anchor="end" fill="currentColor" font-size="12.5">
<text x="80" y="114" fill-opacity="0.7">incoming SP</text>
<text x="80" y="174" font-weight="600">FP</text>
<text x="80" y="414" font-weight="600">SP</text>
</g>
<g text-anchor="middle" fill="currentColor" fill-opacity="0.6" font-size="12">
<text x="225" y="436">with VLAs: the same picture,</text>
<text x="225" y="452">they are allocated below the slot</text>
</g>
</g>

<!-- ============ 2: FP == SP, fixed frame ============ -->
<g transform="translate(335 0)">
<g text-anchor="middle" fill="currentColor">
<text x="225" y="30" font-size="15" font-weight="600">FP == SP after the prologue</text>
<text x="225" y="48" font-size="12" fill-opacity="0.65">Mips, SystemZ</text>
</g>
<rect x="140" y="70" width="170" height="40" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="4 3"/>
<g fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6">
<rect x="140" y="110" width="170" height="60"/>
<rect x="140" y="170" width="170" height="166"/>
<rect x="140" y="360" width="170" height="50"/>
</g>
<rect x="140" y="336" width="170" height="24" fill="#2a9d7f" fill-opacity="0.25" stroke="#2a9d7f" stroke-width="1.5"/>
<g text-anchor="middle" fill="currentColor" font-size="12.5">
<text x="225" y="94" fill-opacity="0.65">incoming stack arguments</text>
<text x="225" y="136">return address,</text>
<text x="225" y="152">callee-saved registers</text>
<text x="225" y="249">local variables,</text>
<text x="225" y="265">spill slots</text>
<text x="225" y="352" font-weight="600">emergency slot</text>
<text x="225" y="382">outgoing arguments</text>
<text x="225" y="399" font-size="11.5" fill-opacity="0.65">call frame, if reserved</text>
</g>
<g stroke="currentColor" stroke-width="1.3" marker-end="url(#ff-arrow)">
<line x1="86" y1="110" x2="136" y2="110"/>
<line x1="86" y1="410" x2="136" y2="410"/>
</g>
<g text-anchor="end" fill="currentColor" font-size="12.5">
<text x="80" y="114" fill-opacity="0.7">incoming SP</text>
<text x="80" y="414" font-weight="600">SP == FP</text>
</g>
</g>

<!-- ============ 3: FP == SP, with VLAs ============ -->
<g transform="translate(670 0)">
<g text-anchor="middle" fill="currentColor">
<text x="225" y="30" font-size="15" font-weight="600">If there are VLAs</text>
<text x="225" y="48" font-size="12" fill-opacity="0.65">SP moves, FP is stable</text>
</g>
<rect x="140" y="70" width="170" height="40" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.4" stroke-dasharray="4 3"/>
<g fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6">
<rect x="140" y="110" width="170" height="60"/>
<rect x="140" y="170" width="170" height="106"/>
<rect x="140" y="370" width="170" height="40"/>
</g>
<rect x="140" y="300" width="170" height="70" fill="url(#ff-hatch)" stroke="currentColor" stroke-opacity="0.6"/>
<rect x="140" y="276" width="170" height="24" fill="#2a9d7f" fill-opacity="0.25" stroke="#2a9d7f" stroke-width="1.5"/>
<g text-anchor="middle" fill="currentColor" font-size="12.5">
<text x="225" y="94" fill-opacity="0.65">incoming stack arguments</text>
<text x="225" y="136">return address,</text>
<text x="225" y="152">callee-saved registers</text>
<text x="225" y="219">local variables,</text>
<text x="225" y="235">spill slots</text>
<text x="225" y="292" font-weight="600">emergency slot</text>
<text x="225" y="331" font-weight="600">VLAs, alloca</text>
<text x="225" y="348" font-size="11.5" fill-opacity="0.7">size known only at run time</text>
<text x="225" y="394">outgoing arguments</text>
</g>
<g stroke="currentColor" stroke-width="1.3" marker-end="url(#ff-arrow)">
<line x1="86" y1="110" x2="136" y2="110"/>
<line x1="86" y1="300" x2="136" y2="300"/>
<line x1="86" y1="410" x2="136" y2="410"/>
</g>
<g text-anchor="end" fill="currentColor" font-size="12.5">
<text x="80" y="114" fill-opacity="0.7">incoming SP</text>
<text x="80" y="304" font-weight="600">FP</text>
<text x="80" y="414" font-weight="600">SP</text>
</g>
</g>
</svg>
