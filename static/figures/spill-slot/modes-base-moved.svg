<svg xmlns="http://www.w3.org/2000/svg" id="fig-modes-base-moved" viewBox="0 12 280 322" width="280" height="322" style="width: 280px; max-width: 100%; height: auto;" role="img" font-family="'IBM Plex Sans', system-ui, sans-serif">
  <defs>
    <marker id="fm-base-moved-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="currentColor" />
    </marker>
  </defs>
  <g transform="translate(-520 0)">
    <g text-anchor="middle" fill="currentColor">
      <text x="660" y="36" font-size="14.5" font-weight="600">SP-relative, but SP moved</text>
      <text x="660" y="58" font-size="11.5" fill-opacity="0.65">incoming SP</text>
    </g>
    <g fill="currentColor" fill-opacity="0.06" stroke="currentColor" stroke-opacity="0.6">
      <rect x="585" y="70" width="150" height="100" />
    </g>
    <rect x="585" y="196" width="150" height="94" fill="currentColor" fill-opacity="0.03" stroke="currentColor" stroke-opacity="0.5" stroke-dasharray="4 3" />
    <rect x="585" y="170" width="150" height="26" fill="#d1495b" fill-opacity="0.14" stroke="#d1495b" stroke-width="1.5" />
    <g text-anchor="middle" fill="currentColor" font-size="12.5">
      <text x="660" y="124">locals</text>
      <text x="660" y="187" font-weight="600">slot</text>
      <text x="660" y="240" fill-opacity="0.75">arguments pushed</text>
      <text x="660" y="256" fill-opacity="0.75">for this call</text>
    </g>
    <path d="M739 290h8V183h-8" fill="none" stroke="#d1495b" stroke-width="1.5" />
    <text transform="rotate(-90 762 236)" x="762" y="236" text-anchor="middle" font-size="12" fill="#d1495b" font-weight="600">offset + call size</text>
    <line x1="540" y1="196" x2="581" y2="196" stroke="currentColor" stroke-opacity="0.55" stroke-width="1.3" stroke-dasharray="3 3" />
    <text x="579" y="214" text-anchor="end" font-size="11.5" fill="currentColor" fill-opacity="0.65">SP before</text>
    <line x1="540" y1="290" x2="581" y2="290" stroke="currentColor" stroke-width="1.3" marker-end="url(#fm-base-moved-arrow)" />
    <text x="579" y="282" text-anchor="end" font-size="12.5" font-weight="600" fill="currentColor">SP</text>
    <g fill="currentColor" font-size="12" text-anchor="middle">
      <text x="660" y="322" fill-opacity="0.7">no FP means SP must not move</text>
    </g>
